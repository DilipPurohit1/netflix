<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Sign In</title>

    <link rel="stylesheet"
          href="login.css">

</head>


<body class="auth-page">


<a href="index.html" class="auth-logo">
    <img src="https://upload.wikimedia.org/wikipedia/commons/7/7a/Logonetflix.png"
         alt="Netflix Logo">
</a>



<div class="login-box">


    <h1>
        Sign In
    </h1>


    <form
        onsubmit="loginUser(event)">


        <input
            type="text"
            id="loginEmail"
            placeholder="Email or mobile number"
            required
>
        


        <input
            type="password"
            id="loginPassword"
            placeholder="Password"
            required
        >


        <button type="submit">

            Sign In

        </button>
<div class="signup">
    <span>New to Netflix? </span>
    <a href="signup.html">Sign up now.</a>
</div>

    </form>


    

</div>



<script src="login.js"></script>


</body>

</html>
